# After CI passes on main, tag the commit v0.0.(PATCH+1) and publish a matching
# container image to ghcr.io. Same scheme as guettli/giki: a red commit is never
# tagged, and Renovate in guettli/gitops watches the image tags and bumps the
# deployment (k8s/plain/vps/vibetype).
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Tag and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail
          if existing=$(git tag --points-at "$HEAD_SHA" | grep '^v' | head -n1) && [ -n "$existing" ]; then
            echo "$HEAD_SHA is already tagged $existing; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next=v0.0.1
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "releasing $next (previous: ${latest:-none})"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.version.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.tag }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tagged last, so a tag means "an image for this commit exists".
      - name: Push the tag
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.tag }}" "$HEAD_SHA"
          git push origin "${{ steps.version.outputs.tag }}"
