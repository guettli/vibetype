# After CI passes on main, tag the commit v0.0.(PATCH+1), publish a matching
# container image to ghcr.io and point the `deploy` branch at it. A red commit is
# never tagged. Flux on the production cluster follows the `deploy` branch and
# applies deploy/ from it (see deploy/README.md).
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Tag and publish
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          set -euo pipefail
          if existing=$(git tag --points-at "$HEAD_SHA" | grep '^v' | head -n1) && [ -n "$existing" ]; then
            echo "$HEAD_SHA is already tagged $existing; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next=v0.0.1
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "releasing $next (previous: ${latest:-none})"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.version.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: VERSION=${{ steps.version.outputs.tag }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tagged last, so a tag means "an image for this commit exists".
      - name: Push the tag
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.tag }}" "$HEAD_SHA"
          git push origin "${{ steps.version.outputs.tag }}"

      # Flux follows this branch. It is the tagged commit plus one commit that
      # sets the image tag in deploy/kustomization.yaml (a commit cannot name its
      # own tag). Force-pushed: it always points at the latest release.
      - name: Point the deploy branch at the release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$HEAD_SHA"
          sed -i "s/^    newTag: .*/    newTag: $TAG/" deploy/kustomization.yaml
          grep -qx "    newTag: $TAG" deploy/kustomization.yaml
          git commit -am "deploy $TAG"
          git push --force origin HEAD:refs/heads/deploy
